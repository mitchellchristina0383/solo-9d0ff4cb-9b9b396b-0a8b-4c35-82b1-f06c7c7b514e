services:
  gpu-scheduler:
    build: .
    image: gpu-partition-scheduler:1.0.0
    container_name: gpu-partition-scheduler
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
